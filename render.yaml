services:
  - type: web
    name: lilivet
    runtime: node
    plan: free
    branch: codex/neon-backend-setup
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /tmp/lilivet-uploads
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DRAFT_EXPIRY_HOURS
        value: "72"
      - key: UNATTACHED_FILE_EXPIRY_HOURS
        value: "24"
      - key: DUPLICATE_WINDOW_HOURS
        value: "48"
      - key: RESCHEDULE_TOKEN_EXPIRY_HOURS
        value: "168"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: STAFF_SEED_EMAIL
        sync: false
      - key: STAFF_SEED_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PUBLIC_WEBSITE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLINIC_NOTIFICATION_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: cron
    name: lilivet-overdue-sweep
    runtime: node
    branch: codex/neon-backend-setup
    schedule: "*/15 * * * *"
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run appointments:mark-overdue
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
