services:
  - type: web
    name: lilivet
    runtime: node
    plan: free
    branch: codex/neon-backend-setup
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_PROVIDER
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/lilivet-uploads
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_KEY_PREFIX
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DRAFT_EXPIRY_HOURS
        value: "72"
      - key: UNATTACHED_FILE_EXPIRY_HOURS
        value: "24"
      - key: DUPLICATE_WINDOW_HOURS
        value: "48"
      - key: RESCHEDULE_TOKEN_EXPIRY_HOURS
        value: "168"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: STAFF_SESSION_MAX_AGE_HOURS
        value: "4"
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: MFA_REQUIRED_FOR_STAFF
        value: "false"
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: STAFF_SEED_EMAIL
        sync: false
      - key: STAFF_SEED_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PUBLIC_WEBSITE_URL
        sync: false
      - key: STAFF_DASHBOARD_URL
        sync: false
      - key: STAFF_ALLOWED_ORIGINS
        value: "https://admin.liliveterinaryhospital.com,https://lili-staff-dashboard.vercel.app"
      - key: CORS_ORIGIN
        sync: false
      - key: CLINIC_NOTIFICATION_EMAIL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PET_CARE_NEWSLETTER_ENABLED
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_PET_CARE_LIST_ID
        value: "4"
      - key: BREVO_DOI_TEMPLATE_ID
        value: "1"
      - key: BREVO_DOI_REDIRECT_URL
        value: "https://liliveterinaryhospital.com/pet-care?subscription=confirmed"
      - key: BREVO_PET_PREFERENCE_ATTRIBUTE
        value: "PET_PREFERENCE"

  - type: cron
    name: lilivet-overdue-sweep
    runtime: node
    branch: codex/neon-backend-setup
    schedule: "*/15 * * * *"
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run appointments:mark-overdue
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
